<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Felicia Greiff</title>
<link rel="icon" type="image/svg+xml" href="fg-monogram.svg">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Lora', Georgia, serif; background:#fff; color:#111; font-size:18px; line-height:1.6; }
nav { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.25rem 2.5rem; border-bottom:1px solid #e4e4e4; }
.nav-name { display:inline-flex; align-items:center; gap:0.8rem; font-size:1.05rem; font-weight:400; text-decoration:none; color:#111; }
.nav-monogram { width:42px; height:42px; display:block; flex:none; }
.nav-right { display:flex; align-items:center; gap:2rem; }
.nav-right a { font-size:0.95rem; color:#111; text-decoration:none; }
.nav-right a:hover { text-decoration:underline; }
@media (max-width:600px) { nav { padding:1rem 1.25rem; } .nav-monogram { width:34px; height:34px; } .nav-right { gap:1rem; } .nav-name { font-size:0.95rem; gap:0.5rem; } }
.contact-wrap { padding:6rem 2.5rem 5rem; max-width:640px; }
.contact-heading { font-size:clamp(2rem,3.2vw,2.55rem); font-weight:400; line-height:1.3; letter-spacing:-0.01em; margin-bottom:3rem; }
.form-field { margin-bottom:2rem; }
label { display:block; font-size:0.82rem; letter-spacing:0.08em; text-transform:uppercase; color:#777; margin-bottom:0.5rem; font-family:-apple-system,'Helvetica Neue',sans-serif; }
input[type="text"],input[type="email"],textarea { width:100%; border:none; border-bottom:1px solid #ddd; padding:0.6rem 0; font-family:'Lora',Georgia,serif; font-size:1.1rem; color:#111; background:transparent; outline:none; transition:border-color 0.2s; border-radius:0; }
input[type="text"]:focus,input[type="email"]:focus,textarea:focus { border-bottom-color:#1F5A61; }
textarea { resize:vertical; min-height:120px; line-height:1.6; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-bottom:2rem; }
button[type="submit"] { margin-top:1rem; background:#1F5A61; color:#fff; border:none; padding:0.9rem 2.5rem; font-family:-apple-system,'Helvetica Neue',sans-serif; font-size:0.8rem; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:opacity 0.2s; }
button[type="submit"]:hover { opacity:0.75; }
@media(max-width:600px){ .contact-wrap {padding:3.5rem 1.25rem 4rem;} .form-row {grid-template-columns:1fr; gap:0; margin-bottom:0;} }

</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-name" aria-label="Felicia Greiff — home"><img class="nav-monogram" src="fg-monogram.svg" alt="FG monogram"><span>Felicia Greiff</span></a>
  <div class="nav-right">
    <a href="index.html">Back</a>
    <a href="https://linkedin.com/in/feliciagreiff" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">in</a>
    <a href="https://x.com/feliciagreiff" target="_blank" rel="noopener noreferrer" aria-label="X">𝕏</a>
  </div>
</nav>
<main class="contact-wrap">
  <h1 class="contact-heading">Contact me using the form below.</h1>
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
    <input type="hidden" name="form-name" value="contact">
    <input type="hidden" name="_to" value="feliciagreiff@gmail.com">
    <p style="display:none"><label>Leave this field blank: <input name="bot-field"></label></p>
    <div class="form-row">
      <div class="form-field"><label for="first-name">First Name</label><input type="text" id="first-name" name="first-name" autocomplete="given-name" required></div>
      <div class="form-field"><label for="last-name">Last Name</label><input type="text" id="last-name" name="last-name" autocomplete="family-name" required></div>
    </div>
    <div class="form-field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></div>
    <div class="form-field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
    <button type="submit">Send</button>
  </form>
</main>
</body>
</html>
