<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Felicia Greiff</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Lora', Georgia, serif;
  background: #fff;
  color: #111;
  font-size: 18px;
  line-height: 1.6;
}

nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 2.5rem;
  border-bottom: 1px solid #e4e4e4;
}
.nav-name { font-size: 1.05rem; font-weight: 400; text-decoration: none; color: #111; }
.nav-right { display: flex; align-items: center; gap: 2rem; }
.nav-right a { font-size: 0.95rem; color: #111; text-decoration: none; }
.nav-right a:hover { text-decoration: underline; }

.contact-wrap {
  padding: 6rem 2.5rem 5rem;
  max-width: 640px;
}

.contact-heading {
  font-size: clamp(2rem, 3.2vw, 2.55rem);
  font-weight: 400;
  line-height: 1.3;
  letter-spacing: -0.01em;
  margin-bottom: 3rem;
}

.form-field {
  margin-bottom: 2rem;
}

label {
  display: block;
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #999;
  margin-bottom: 0.5rem;
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
}

input[type="text"],
input[type="email"],
textarea {
  width: 100%;
  border: none;
  border-bottom: 1px solid #ddd;
  padding: 0.6rem 0;
  font-family: 'Lora', Georgia, serif;
  font-size: 1.1rem;
  color: #111;
  background: transparent;
  outline: none;
  transition: border-color 0.2s;
  border-radius: 0;
}

input[type="text"]:focus,
input[type="email"]:focus,
textarea:focus {
  border-bottom-color: #111;
}

textarea {
  resize: none;
  height: 120px;
  line-height: 1.6;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-bottom: 2rem;
}

button[type="submit"] {
  margin-top: 1rem;
  background: #111;
  color: #fff;
  border: none;
  padding: 0.9rem 2.5rem;
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s;
}
button[type="submit"]:hover { opacity: 0.65; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-name">Felicia Greiff</a>
  <div class="nav-right">
    <a href="index.html">Back</a>
    <a href="https://linkedin.com/in/feliciagreiff" target="_blank">in</a>
    <a href="https://x.com/feliciagreiff" target="_blank">&#x1D54F;</a>
  </div>
</nav>

<div class="contact-wrap">
  <h1 class="contact-heading">Contact me using the form below.</h1>

  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
    <input type="hidden" name="form-name" value="contact">
    <input type="hidden" name="_to" value="feliciagreiff@gmail.com">
    <p style="display:none"><input name="bot-field"></p>

    <div class="form-row">
      <div class="form-field">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" required>
      </div>
      <div class="form-field">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" required>
      </div>
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-field">
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <button type="submit">Send</button>
  </form>
</div>

</body>
</html>
